[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rgcbot"
version = "1.0.0"
description = "Production-grade Telegram Group Management & Fun Bot with Ephemeral Auto-Deletion Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "aiohttp>=3.9.5",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pillow>=10.3.0",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

